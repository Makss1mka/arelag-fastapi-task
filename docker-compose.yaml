
x-payment-service-environment: &payment-service-environment
  # DB
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_HOST: "payment-service-database"
  DB_PORT: "5432"

  # REDIS
  REDIS_HOST: "payment-service-redis"
  REDIS_PORT: "6379"

  # OTHER
  DEFAULT_FROM_EMAIL: ${CAR_DEFAULT_FROM_EMAIL}
  SECRET_KEY: ${CAR_DEALERSHIP_APP_SECRET_KEY}
  DEBUG_MODE: ${CAR_DEALERSHIP_DEBUG_MODE}


services:
  payment-service-redis:
    image: redis:7
    container_name: "payment-service-redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    networks:
      - backend

  payment-service-database:
    image: postgres:17
    container_name: "payment-service-database"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
    networks:
      - backend

  payment-service-app:
    build: .
    container_name: "payment-service"
    environment:
      <<: *payment-service-environment
    depends_on:
      payment-service-database:
        condition: service_healthy
      payment-service-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    networks:
      - backend

networks:
  backend:
    driver: bridge
